name: Feature request
description: Propose an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What are you trying to do that is hard today?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution / API sketch }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
