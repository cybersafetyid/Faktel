name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4

      - name: Tag must match VERSION_NAME
        run: |
          v=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          [[ "v$v" == "${GITHUB_REF_NAME}" ]] || { echo "Tag ${GITHUB_REF_NAME} != VERSION_NAME v$v"; exit 1; }

      - name: Verify
        run: ./gradlew jvmTest iosSimulatorArm64Test apiCheck

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Build and zip XCFramework
        run: |
          ./gradlew :faktel:assembleFaktelXCFramework
          cd faktel/build/XCFrameworks/release
          zip -r -y "$GITHUB_WORKSPACE/Faktel-${GITHUB_REF_NAME}.xcframework.zip" Faktel.xcframework
          cd "$GITHUB_WORKSPACE"
          swift package compute-checksum "Faktel-${GITHUB_REF_NAME}.xcframework.zip" > checksum.txt

      - name: Extract release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "XCFramework SwiftPM checksum: \`$(cat checksum.txt)\`" >> notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Faktel-${GITHUB_REF_NAME}.xcframework.zip" --title "Faktel ${GITHUB_REF_NAME#v}" --notes-file notes.md
