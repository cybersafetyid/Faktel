name: FaktelDemo
options:
  bundleIdPrefix: io.github.cybersafetyid.faktel
  deploymentTarget: { iOS: "17.0" }
packages:
  FaktelOnnxRuntime:
    path: ../../ios/FaktelOnnxRuntime
targets:
  FaktelDemo:
    type: application
    platform: iOS
    sources:
      - FaktelDemo
      # Models and sample photos live once, at the repository root, and are bundled as resources.
      - { path: ../../models/face_detection_yunet_2023mar.onnx, buildPhase: resources }
      - { path: ../../models/minifasnet_v2.onnx, buildPhase: resources }
      - { path: ../assets/face_b.jpg, buildPhase: resources }
      - { path: ../assets/ktp_sample.jpg, buildPhase: resources }
    dependencies:
      - package: FaktelOnnxRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cybersafetyid.faktel.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Faktel Demo
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.9"
